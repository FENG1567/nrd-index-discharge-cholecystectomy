name: public-reproducibility

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile analysis and figure code
        run: python -m compileall analysis figures tests
      - name: Run unit and smoke tests
        run: python -m unittest discover -s tests -v
      - name: Run repository integrity check
        run: python tests/validate_repository.py
      - name: Build aggregate figures
        run: python figures/build_public_figures.py --output-dir build/figures

